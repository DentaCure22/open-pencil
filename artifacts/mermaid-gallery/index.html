<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenPencil Mermaid Boards</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111214;
        color: #f5f5f2;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 32px;
        background: #111214;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        max-width: 1800px;
        margin: 0 auto 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 3vw, 40px);
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: #a9adb5;
        font-size: 13px;
      }

      main {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        max-width: 1800px;
        margin: 0 auto;
      }

      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid #2b2e33;
        border-radius: 16px;
        background: #1a1c20;
        box-shadow: 0 18px 54px rgb(0 0 0 / 28%);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }

      @media (max-width: 900px) {
        body { padding: 16px; }
        header { align-items: start; flex-direction: column; }
        main { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Mermaid on OpenPencil</h1>
      <p>Type catalog · Flows · Models · Planning and analysis</p>
    </header>
    <main>
      <figure><img src="board-01.png" alt="Mermaid diagram type catalog board" /></figure>
      <figure><img src="board-02.png" alt="Mermaid flow examples board" /></figure>
      <figure><img src="board-03.png" alt="Mermaid model examples board" /></figure>
      <figure><img src="board-04.png" alt="Mermaid planning and analysis board" /></figure>
    </main>
  </body>
</html>
