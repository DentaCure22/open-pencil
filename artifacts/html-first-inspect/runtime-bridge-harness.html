<!doctype html>
    <html>
      <head>
        <meta charset="utf-8">
        <style>
          * { box-sizing: border-box; }
          body { margin: 0; background: #111215; color: #f7f7f8; font-family: Inter, system-ui, sans-serif; }
          header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid #282a30; }
          header strong { font-size: 13px; }
          header span { color: #8f939d; font-size: 12px; }
          main { display: grid; grid-template-columns: minmax(0, 1fr) 304px; height: calc(100vh - 56px); }
          .canvas { display: grid; place-items: center; padding: 36px; background: radial-gradient(circle at 50% 35%, #24262c, #17181c 64%); }
          .board { width: 920px; max-width: 100%; }
          .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 11px; color: #a8abb4; }
          .modes { display: flex; gap: 4px; }
          .modes span { padding: 4px 9px; border-radius: 999px; }
          .modes .active { background: #f6f7f9; color: #17181b; }
          iframe { display: block; width: 100%; aspect-ratio: 16 / 10; border: 0; border-radius: 14px; background: white; box-shadow: 0 24px 70px rgba(0,0,0,.35); }
          aside { border-left: 1px solid #282a30; background: #17181c; padding: 22px 20px; }
          aside h2 { margin: 0 0 6px; font-size: 13px; }
          aside .hint { margin: 0; color: #8f939d; font-size: 11px; line-height: 1.5; }
          #selection { margin-top: 24px; }
          #selection code { color: #8cabff; font-size: 12px; }
          #selection .selector { margin-top: 7px; color: #8f939d; font: 10px ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
          dl { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; margin: 20px 0 0; }
          dt { color: #6f737e; font-size: 9px; text-transform: uppercase; letter-spacing: .08em; }
          dd { margin: 4px 0 0; font-size: 11px; }
        </style>
      </head>
      <body>
        <header><strong>HTML board runtime check</strong><span>Production bridge · sandboxed</span></header>
        <main>
          <section class="canvas">
            <div class="board">
              <div class="toolbar"><span>HTML Board · 1440 × 900</span><div class="modes"><span>Design</span><span class="active">Inspect</span><span>Interact</span></div></div>
              <iframe id="board" name="openpencil-inspect" sandbox="allow-scripts"></iframe>
            </div>
          </section>
          <aside>
            <h2>HTML design source</h2>
            <p class="hint">Click the real DOM. OpenPencil receives element identity and computed styles without same-origin access.</p>
            <div id="selection"><span class="hint">Waiting for an element…</span></div>
          </aside>
        </main>
        <script>
          const runtimeSrcdoc = "\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003cstyle data-openpencil-html-board>html,body{margin:0;min-height:100%;}:root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }\n* { box-sizing: border-box; }\nbody { margin: 0; background: #f5f5f2; color: #171717; }\n.site { width: 100%; min-height: 100vh; padding: 48px 64px; }\nnav { display: flex; justify-content: space-between; align-items: center; }\nnav a { color: inherit; text-decoration: none; }\nsection { max-width: 760px; margin-top: 150px; }\n.eyebrow { color: #3159d9; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }\nh1 { margin: 12px 0; font-size: 72px; line-height: .98; letter-spacing: -.05em; }\n.lede { max-width: 620px; color: #666; font-size: 20px; line-height: 1.5; }\n.hero-actions { display: flex; align-items: center; gap: 18px; margin-top: 24px; }\n.op-action { border: 0; border-radius: 10px; padding: 14px 20px; background: #171717; color: white; font-weight: 650; }\u003c/style>\u003c/head>\u003cbody>\u003cmain class=\"site\" data-openpencil-component=\"LandingPage\" data-openpencil-component-id=\"landing-page-1\" data-openpencil-width=\"1440\" data-openpencil-height=\"900\">\n  \u003cnav data-openpencil-component=\"Navigation\" data-openpencil-component-id=\"navigation-1\" data-openpencil-slot=\"navigation-status\" data-openpencil-slot-label=\"Navigation status\" data-openpencil-slot-accepts=\"SmylrAvatar,SmylrBadge,SmylrDropdownMenu\">\u003cstrong>New project\u003c/strong>\u003ca href=\"#content\">Explore\u003c/a>\u003c/nav>\n  \u003csection id=\"content\" data-openpencil-component=\"Hero\" data-openpencil-component-id=\"hero-1\" data-openpencil-slot=\"hero-content\" data-openpencil-slot-label=\"Hero content\" data-openpencil-slot-accepts=\"SmylrAccordion,SmylrAlert,SmylrCalendar,SmylrCard,SmylrProgress,SmylrSeparator,SmylrTable,SmylrTabs,SmylrTooltip\">\n    \u003cp class=\"eyebrow\">HTML-first canvas\u003c/p>\n    \u003ch1>Design the real interface.\u003c/h1>\n    \u003cp class=\"lede\">Edit standard HTML and CSS, then interact with the result directly on the board.\u003c/p>\n    \u003cdiv class=\"hero-actions\" data-openpencil-slot=\"hero-actions\" data-openpencil-slot-label=\"Hero controls\" data-openpencil-slot-accepts=\"ActionButton,TextLink,SmylrButton,SmylrCheckbox,SmylrInput,SmylrRadioGroup,SmylrSelect,SmylrSlider,SmylrSwitch,SmylrTextarea\">\n      \u003cbutton class=\"op-action\" type=\"button\" aria-pressed=\"false\" data-openpencil-component=\"PrimaryAction\" data-openpencil-component-id=\"primary-action-1\" data-openpencil-prop-label=\"Start here\" data-openpencil-control-label=\"text\" data-openpencil-bind-label=\"text\" data-openpencil-prop-tone=\"solid\" data-openpencil-control-tone=\"select\" data-openpencil-options-tone=\"solid,soft\" data-openpencil-bind-tone=\"attribute:data-tone\" data-openpencil-variant=\"primary\" data-tone=\"solid\">Start here\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\u003c/main>\n\u003cfooter>Revision two\u003c/footer>\u003cscript data-openpencil-html-board-js>const action = document.querySelector('[data-openpencil-component=\"PrimaryAction\"]')\naction?.addEventListener('click', () => {\n  action.setAttribute('aria-pressed', 'true')\n  action.textContent = 'Started'\n})\u003c/script>\u003cstyle data-openpencil-bridge-style>\n[data-openpencil-inspected=\"hover\"] { outline: 2px solid cornflowerblue !important; outline-offset: -2px !important; cursor: crosshair !important; }\n[data-openpencil-inspected=\"selected\"] { outline: 2px solid royalblue !important; outline-offset: -2px !important; box-shadow: inset 0 0 0 1px white !important; }\n[data-openpencil-live-component=\"true\"] { visibility: hidden !important; pointer-events: none !important; }\n\u003c/style>\u003cscript data-openpencil-bridge>\n(() => {\n  const KIND = 'OPENPENCIL_HTML_BOARD_V1'\n  const TRUSTED_COMPONENT_ROUTES = new Set([\"/open-pencil-renderer?component=accordion&embed=1\",\"/open-pencil-renderer?component=alert&embed=1\",\"/open-pencil-renderer?component=avatar&embed=1\",\"/open-pencil-renderer?component=badge&embed=1\",\"/open-pencil-renderer?component=button&embed=1\",\"/open-pencil-renderer?component=calendar&embed=1\",\"/open-pencil-renderer?component=card&embed=1\",\"/open-pencil-renderer?component=checkbox&embed=1\",\"/open-pencil-renderer?component=dropdown-menu&embed=1\",\"/open-pencil-renderer?component=input&embed=1\",\"/open-pencil-renderer?component=progress&embed=1\",\"/open-pencil-renderer?component=radio-group&embed=1\",\"/open-pencil-renderer?component=select&embed=1\",\"/open-pencil-renderer?component=separator&embed=1\",\"/open-pencil-renderer?component=slider&embed=1\",\"/open-pencil-renderer?component=switch&embed=1\",\"/open-pencil-renderer?component=table&embed=1\",\"/open-pencil-renderer?component=textarea&embed=1\",\"/open-pencil-renderer?component=tabs&embed=1\",\"/open-pencil-renderer?component=tooltip&embed=1\"])\n  const STYLE_PROPERTIES = ['display', 'position', 'width', 'height', 'margin', 'padding', 'gap', 'color', 'background-color', 'font-family', 'font-size', 'font-weight', 'line-height', 'border-radius']\n  let mode = 'design'\n  let hovered = null\n  let selected = null\n  let hostPort = null\n\n  function liveComponentPayload() {\n    const components = []\n    for (const frame of document.querySelectorAll('iframe[data-openpencil-live-component=\"true\"]')) {\n      const route = frame.getAttribute('data-openpencil-renderer-route') || ''\n      if (!TRUSTED_COMPONENT_ROUTES.has(route)) continue\n      const wrapper = frame.closest('[data-openpencil-component-id]')\n      const componentId = wrapper?.getAttribute('data-openpencil-component-id') || ''\n      const rect = frame.getBoundingClientRect()\n      if (!componentId || rect.width \u003c= 0 || rect.height \u003c= 0) continue\n      components.push({\n        componentId,\n        rect: { height: rect.height, width: rect.width, x: rect.x, y: rect.y },\n        route\n      })\n      if (components.length >= 12) break\n    }\n    return components\n  }\n\n  function publishLiveComponents() {\n    sendToHost({ action: 'live-components', payload: liveComponentPayload() })\n  }\n\n  function activeMode() {\n    const nameMode = window.name.startsWith('openpencil-') ? window.name.slice(11) : ''\n    return ['design', 'inspect', 'interact'].includes(nameMode) ? nameMode : mode\n  }\n\n  function clearMark(element) {\n    if (element instanceof Element) element.removeAttribute('data-openpencil-inspected')\n  }\n\n  function mark(element, state) {\n    if (!(element instanceof Element)) return\n    if (state === 'hover' && element === selected) return\n    element.setAttribute('data-openpencil-inspected', state)\n  }\n\n  function selectorFor(element) {\n    if (element.id) return '#' + CSS.escape(element.id)\n    const parts = []\n    let current = element\n    while (current && current !== document.documentElement && parts.length \u003c 5) {\n      if (current.id) {\n        parts.unshift('#' + CSS.escape(current.id))\n        break\n      }\n      let part = current.tagName.toLowerCase()\n      const parent = current.parentElement\n      if (parent) {\n        const sameTag = Array.from(parent.children).filter((child) => child.tagName === current.tagName)\n        if (sameTag.length > 1) part += ':nth-of-type(' + (sameTag.indexOf(current) + 1) + ')'\n      }\n      parts.unshift(part)\n      current = parent\n    }\n    return parts.join(' > ')\n  }\n\n  function selectionPayload(element) {\n    const rect = element.getBoundingClientRect()\n    const computed = getComputedStyle(element)\n    const styles = {}\n    const componentProps = {}\n    const componentControls = {}\n    for (const property of STYLE_PROPERTIES) styles[property] = computed.getPropertyValue(property)\n    for (const attribute of element.attributes) {\n      if (attribute.name.startsWith('data-openpencil-prop-')) {\n        componentProps[attribute.name.replace('data-openpencil-prop-', '')] = attribute.value\n      }\n    }\n    for (const name of Object.keys(componentProps)) {\n      const declaredType = element.getAttribute('data-openpencil-control-' + name) || 'text'\n      const type = ['boolean', 'select', 'text'].includes(declaredType) ? declaredType : 'text'\n      const options = (element.getAttribute('data-openpencil-options-' + name) || '')\n        .split(',')\n        .map((value) => value.trim())\n        .filter(Boolean)\n        .slice(0, 12)\n      componentControls[name] = {\n        binding: element.getAttribute('data-openpencil-bind-' + name) || 'metadata',\n        options,\n        type\n      }\n    }\n    return {\n      className: typeof element.className === 'string' ? element.className : '',\n      componentControls,\n      componentId: element.getAttribute('data-openpencil-component-id') || '',\n      componentName: element.getAttribute('data-openpencil-component') || '',\n      componentProps,\n      componentVariant: element.getAttribute('data-openpencil-variant') || '',\n      id: element.id || '',\n      rect: { height: rect.height, width: rect.width, x: rect.x, y: rect.y },\n      selector: selectorFor(element),\n      slotAccepts: (element.getAttribute('data-openpencil-slot-accepts') || '')\n        .split(',')\n        .map((value) => value.trim())\n        .filter(Boolean)\n        .slice(0, 12),\n      slotChildCount: element.children.length,\n      slotLabel: element.getAttribute('data-openpencil-slot-label') || '',\n      slotName: element.getAttribute('data-openpencil-slot') || '',\n      styles,\n      tagName: element.tagName.toLowerCase(),\n      text: (element.textContent || '').replace(/\\s+/g, ' ').trim().slice(0, 140)\n    }\n  }\n\n  function sendToHost(message) {\n    const payload = { ...message, kind: KIND }\n    if (hostPort) hostPort.postMessage(payload)\n    else parent.postMessage(payload, '*')\n  }\n\n  function handleHostMessage(message) {\n    if (!message || message.kind !== KIND) return\n    if (message.action === 'set-mode') {\n      mode = message.mode\n      document.documentElement.dataset.openpencilMode = mode\n      if (mode !== 'inspect') {\n        clearMark(hovered)\n        clearMark(selected)\n        hovered = null\n        selected = null\n      }\n    }\n    if (message.action === 'set-selection' && typeof message.selector === 'string') {\n      try {\n        const element = document.querySelector(message.selector)\n        if (element) {\n          clearMark(selected)\n          selected = element\n          hovered = element\n          mark(selected, 'selected')\n          sendToHost({ action: 'selection', payload: selectionPayload(selected) })\n        }\n      } catch {\n        // The selector is advisory and may become stale after source edits.\n      }\n    }\n  }\n\n  window.addEventListener('message', (event) => {\n    const message = event.data\n    if (!message || message.kind !== KIND) return\n    if (message.action === 'connect' && event.ports[0]) {\n      hostPort?.close()\n      hostPort = event.ports[0]\n      hostPort.onmessage = (portEvent) => handleHostMessage(portEvent.data)\n      hostPort.start()\n      sendToHost({ action: 'ready' })\n      publishLiveComponents()\n      return\n    }\n    handleHostMessage(message)\n  })\n\n  document.addEventListener('pointerover', (event) => {\n    if (activeMode() !== 'inspect' || !(event.target instanceof Element)) return\n    if (hovered && hovered !== selected) clearMark(hovered)\n    hovered = event.target\n    mark(hovered, 'hover')\n  }, true)\n\n  document.addEventListener('click', (event) => {\n    if (activeMode() !== 'inspect' || !(event.target instanceof Element)) return\n    event.preventDefault()\n    event.stopImmediatePropagation()\n    clearMark(selected)\n    selected = event.target\n    hovered = selected\n    mark(selected, 'selected')\n    sendToHost({ action: 'selection', payload: selectionPayload(selected) })\n  }, true)\n\n  publishLiveComponents()\n  sendToHost({ action: 'ready' })\n})()\n\u003c/script>\u003c/body>\u003c/html>"
          window.__bridgeReady = false
          window.__selection = null
          const board = document.querySelector('#board')
          window.addEventListener('message', (event) => {
            if (event.source !== board.contentWindow || event.data?.kind !== 'OPENPENCIL_HTML_BOARD_V1') return
            if (event.data.action === 'ready') {
              window.__bridgeReady = true
              board.contentWindow.postMessage({ action: 'set-mode', kind: 'OPENPENCIL_HTML_BOARD_V1', mode: 'inspect' }, '*')
            }
            if (event.data.action === 'selection') {
              window.__selection = event.data.payload
              const payload = event.data.payload
              document.querySelector('#selection').innerHTML =
                '<code>&lt;' + payload.tagName + '&gt;</code>' +
                '<div class="selector">' + payload.selector + '</div>' +
                '<dl><div><dt>Layout</dt><dd>' + payload.styles.display + ' · ' + payload.styles.position + '</dd></div>' +
                '<div><dt>Size</dt><dd>' + Math.round(payload.rect.width) + ' × ' + Math.round(payload.rect.height) + '</dd></div>' +
                '<div><dt>Spacing</dt><dd>' + payload.styles.padding + '</dd></div>' +
                '<div><dt>Type</dt><dd>' + payload.styles['font-size'] + ' / ' + payload.styles['font-weight'] + '</dd></div></dl>'
            }
          })
          board.srcdoc = runtimeSrcdoc
        </script>
      </body>
    </html>
